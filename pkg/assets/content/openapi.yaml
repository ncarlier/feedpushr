                      mdate: "1971-08-06T22:46:10Z"
                      nbProcessedItems: 626026486032195522
                      nextCheck: "1995-01-04T00:10:54Z"
                      status: stopped
                      tags:
                        - foo
                        - bar
                      title: Hashicorp Blog
                      xmlUrl: http://www.hashicorp.com/feed.xml
                    - cdate: "1977-11-02T08:14:16Z"
                      errorCount: 3103945384136833810
