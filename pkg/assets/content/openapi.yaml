swagger: "2.0"
info:
    title: The feedpushr API
    description: A simple feed aggregator daemon with sugar on top.
    contact:
        name: Nicolas Carlier
        email: ""
        url: https://github.com/ncarlier
    license:
        name: MIT
        url: https://github.com/ncarlier/feedpushr/blob/master/LICENSE
    version: 0.0.1
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /:
        get:
            tags:
                - index
            summary: get index
            description: Get basic API information.
            operationId: index#get
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/Info'
                        required:
                            - name
                            - desc
                            - version
                            - client_id
                            - _links
            schemes:
                - http
    /explore:
        get:
            tags:
                - explore
            summary: get explore
            description: Search RSS feed using external search engine
            operationId: explore#get
            parameters:
                - name: q
                  in: query
                  description: Search query
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/ExploreResult'
                "400":
                    description: Bad Request response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/ExploreResult'
            schemes:
                - http
    /feeds:
        get:
            tags:
                - feed
            summary: list feed
            description: Retrieve all feeds
            operationId: feed#list
            parameters:
                - name: q
                  in: query
                  description: Search query
                  required: false
                  type: string
                - name: page
                  in: query
                  description: Page to fetch
                  required: false
                  type: integer
                  default: 1
                  minimum: 1
                - name: size
                  in: query
                  description: Page size
                  required: false
                  type: integer
                  default: 10
                  minimum: 1
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FeedsPageResult'
                        required:
                            - total
                            - current
                            - size
                            - data
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FeedsPageResult'
                        required:
                            - total
                            - current
                            - size
                            - data
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FeedsPageResult'
                        required:
                            - total
                            - current
                            - size
                            - data
            schemes:
                - http
        post:
            tags:
                - feed
            summary: create feed
            description: Create a new feed
            operationId: feed#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/FeedCreateRequestBody'
                    required:
                        - url
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/FeedResult'
                        required:
                            - id
                            - xmlUrl
                            - title
                            - cdate
                            - mdate
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FeedResult'
                        required:
                            - id
                            - xmlUrl
                            - title
                            - cdate
                            - mdate
            schemes:
                - http
    /feeds/{id}:
        get:
            tags:
                - feed
            summary: get feed
            description: Retrieve feed with given ID
            operationId: feed#get
            parameters:
                - name: id
                  in: path
                  description: Feed ID
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FeedResult'
                        required:
                            - id
                            - xmlUrl
                            - title
                            - cdate
                            - mdate
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FeedResult'
                        required:
                            - id
                            - xmlUrl
                            - title
                            - cdate
                            - mdate
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FeedResult'
                        required:
                            - id
                            - xmlUrl
                            - title
                            - cdate
                            - mdate
            schemes:
                - http
        put:
            tags:
                - feed
            summary: update feed
            description: Update a feed
            operationId: feed#update
            parameters:
                - name: id
                  in: path
                  description: Feed ID
                  required: true
                  type: string
                - name: UpdateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/FeedUpdateRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FeedResult'
                        required:
                            - id
                            - xmlUrl
                            - title
                            - cdate
                            - mdate
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FeedResult'
                        required:
                            - id
                            - xmlUrl
                            - title
                            - cdate
                            - mdate
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FeedResult'
                        required:
                            - id
                            - xmlUrl
                            - title
                            - cdate
                            - mdate
            schemes:
                - http
        delete:
            tags:
                - feed
            summary: delete feed
            description: Delete a feed
            operationId: feed#delete
            parameters:
                - name: id
                  in: path
                  description: Feed ID
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                "404":
                    description: Not Found response.
            schemes:
                - http
    /feeds/{id}/start:
        post:
            tags:
                - feed
            summary: start feed
            description: Start feed aggregation
            operationId: feed#start
            parameters:
                - name: id
                  in: path
                  description: Feed ID
                  required: true
                  type: string
            responses:
                "202":
                    description: Accepted response.
                "400":
                    description: Bad Request response.
                "404":
                    description: Not Found response.
            schemes:
                - http
    /feeds/{id}/stop:
        post:
            tags:
                - feed
            summary: stop feed
            description: Stop feed aggregation
            operationId: feed#stop
            parameters:
                - name: id
                  in: path
                  description: Feed ID
                  required: true
                  type: string
            responses:
                "202":
                    description: Accepted response.
                "400":
                    description: Bad Request response.
                "404":
                    description: Not Found response.
            schemes:
                - http
    /filters/_specs:
        get:
            tags:
                - filter
            summary: specs filter
            description: Retrieve all filter types available
            operationId: filter#specs
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/FilterSpec'
            schemes:
                - http
    /healthz:
        get:
            tags:
                - health
            summary: get health
            description: Perform health check.
            operationId: health#get
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
            schemes:
                - http
    /opml:
        get:
            tags:
                - opml
            summary: get opml
            description: Get all feeds as an OPML format
            operationId: opml#get
            produces:
                - application/xml
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
            schemes:
                - http
        post:
            tags:
                - opml
            summary: upload opml
            description: Upload an OPML file to create feeds
            operationId: opml#upload
            parameters:
                - name: bytes
                  in: body
                  required: true
                  schema:
                    type: string
                    format: byte
            responses:
                "202":
                    description: Accepted response.
                    schema:
                        $ref: '#/definitions/OPMLImportJobResult'
                        required:
                            - id
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/OPMLImportJobResult'
                        required:
                            - id
            schemes:
                - http
    /opml/status/{id}:
        get:
            tags:
                - opml
            summary: status opml
            description: Get OPML import status
            operationId: opml#status
            produces:
                - text/event-stream
            parameters:
                - name: id
                  in: path
                  description: Import job ID
                  required: true
                  type: integer
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
                "404":
                    description: Not Found response.
                    schema:
                        type: string
            schemes:
                - http
    /outputs:
        get:
            tags:
                - output
            summary: list output
            description: Retrieve all outputs definitions
            operationId: output#list
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/OutputResult'
            schemes:
                - http
        post:
            tags:
                - output
            summary: create output
            description: Create a new output
            operationId: output#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/OutputCreateRequestBody'
                    required:
                        - alias
                        - name
                        - condition
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/OutputResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/OutputResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
            schemes:
                - http
    /outputs/_specs:
        get:
            tags:
                - output
            summary: specs output
            description: Retrieve all output types available
            operationId: output#specs
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/OutputSpec'
            schemes:
                - http
    /outputs/{id}:
        get:
            tags:
                - output
            summary: get output
            description: Retrieve output with given ID
            operationId: output#get
            parameters:
                - name: id
                  in: path
                  description: Output ID
                  required: true
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/OutputResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/OutputResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/OutputResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
            schemes:
                - http
        put:
            tags:
                - output
            summary: update output
            description: Update an output
            operationId: output#update
            parameters:
                - name: id
                  in: path
                  description: Output ID
                  required: true
                  type: string
                - name: UpdateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/OutputUpdateRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/OutputResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/OutputResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/OutputResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
            schemes:
                - http
        delete:
            tags:
                - output
            summary: delete output
            description: Delete an output
            operationId: output#delete
            parameters:
                - name: id
                  in: path
                  description: Output ID
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                "404":
                    description: Not Found response.
            schemes:
                - http
    /outputs/{id}/filters:
        post:
            tags:
                - output
            summary: createFilter output
            description: Create a new filter
            operationId: output#createFilter
            parameters:
                - name: id
                  in: path
                  description: Output ID
                  required: true
                  type: string
                - name: CreateFilterRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/OutputCreateFilterRequestBody'
                    required:
                        - alias
                        - name
                        - condition
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/FilterResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FilterResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FilterResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
            schemes:
                - http
    /outputs/{id}/filters/{idFilter}:
        put:
            tags:
                - output
            summary: updateFilter output
            description: Update a filter
            operationId: output#updateFilter
            parameters:
                - name: id
                  in: path
                  description: Output ID
                  required: true
                  type: string
                - name: idFilter
                  in: path
                  description: Filter ID
                  required: true
                  type: string
                - name: UpdateFilterRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/OutputUpdateFilterRequestBody'
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/FilterResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/FilterResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/FilterResult'
                        required:
                            - id
                            - alias
                            - name
                            - desc
                            - condition
                            - props
            schemes:
                - http
        delete:
            tags:
                - output
            summary: deleteFilter output
            description: Delete a filter
            operationId: output#deleteFilter
            parameters:
                - name: id
                  in: path
                  description: Output ID
                  required: true
                  type: string
                - name: idFilter
                  in: path
                  description: Filter ID
                  required: true
                  type: string
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                "404":
                    description: Not Found response.
            schemes:
                - http
    /pshb:
        get:
            tags:
                - pshb
            summary: sub pshb
            description: Callback to validate the (un)subscription to the topic of a Hub
            operationId: pshb#sub
            parameters:
                - name: hub.topic
                  in: query
                  description: The topic URL given in the corresponding subscription request
                  required: true
                  type: string
                  format: uri
                - name: hub.mode
                  in: query
                  description: The literal string "subscribe" or "unsubscribe"
                  required: true
                  type: string
                  enum:
                    - subscribe
                    - unsubscribe
                - name: hub.challenge
                  in: query
                  description: A hub-generated random string
                  required: true
                  type: string
                - name: hub.lease_seconds
                  in: query
                  description: The hub-determined number of seconds that the subscription will stay active before expiring
                  required: false
                  type: integer
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
                "400":
                    description: Bad Request response.
                    schema:
                        type: string
            schemes:
                - http
        post:
            tags:
                - pshb
            summary: pub pshb
            description: Publication endpoint for PSHB hubs
            operationId: pshb#pub
            parameters:
                - name: bytes
                  in: body
                  required: true
                  schema:
                    type: string
                    format: byte
            responses:
                "200":
                    description: OK response.
                "400":
                    description: Bad Request response.
            schemes:
                - http
    /vars:
        get:
            tags:
                - vars
            summary: get vars
            description: Get all internals exp vars
            operationId: vars#get
            produces:
                - application/json
            responses:
                "200":
                    description: OK response.
                    schema: {}
            schemes:
                - http
definitions:
    ExploreResult:
        title: ExploreResult
        type: object
        properties:
            desc:
                type: string
                description: Feed description
                example: A short description...
            htmlUrl:
                type: string
                description: URL of the feed website
                example: http://www.hashicorp.com/blog
            title:
                type: string
                description: Feed title
                example: Blog news...
            xmlUrl:
                type: string
                description: URL of the XML feed
                example: http://www.hashicorp.com/feed.xml
        description: The search result
        example:
            desc: A short description...
            htmlUrl: http://www.hashicorp.com/blog
            title: Blog news...
            xmlUrl: http://www.hashicorp.com/feed.xml
        required:
            - title
            - desc
            - xmlUrl
            - htmlUrl
    FeedCreateRequestBody:
        title: FeedCreateRequestBody
        type: object
        properties:
            enable:
                type: boolean
                description: Feed activation status
                example: true
            tags:
                type: string
                description: Comma separated list of tags
                example: foo,bar
            title:
                type: string
                description: Feed title (will override official feed title)
                example: A cool website
            url:
                type: string
                description: Feed URL
                example: http://www.hashicorp.com/feed.xml
                format: uri
        example:
            enable: true
            tags: foo,bar
            title: A cool website
            url: http://www.hashicorp.com/feed.xml
        required:
            - url
    FeedResult:
        title: FeedResult
        type: object
        properties:
            cdate:
                type: string
                description: Date of creation
                example: "2000-03-06T14:49:42Z"
                format: date-time
            errorCount:
                type: integer
                description: Number of consecutive aggregation errors
                example: 713464200682886544
                format: int64
            errorMsg:
                type: string
                description: Last aggregation error
                example: Qui voluptatem aut asperiores praesentium.
            htmlUrl:
                type: string
                description: URL of the feed website
                example: http://www.hashicorp.com/blog
            hubUrl:
                type: string
                description: URL of the PubSubHubbud hub
                example: http://pubsubhubbub.appspot.com
            id:
                type: string
                description: ID of feed (MD5 of the xmlUrl)
                example: 5bfb841c028281c0051828c115fd1f50
            lastCheck:
                type: string
                description: Last aggregation pass
                example: "1974-09-26T19:17:18Z"
                format: date-time
            mdate:
                type: string
                description: Date of modification
                example: "2000-12-24T01:01:19Z"
                format: date-time
            nbProcessedItems:
                type: integer
                description: Total number of processed items
                example: 2637699590965501373
                format: int64
            nextCheck:
                type: string
                description: Next aggregation pass
                example: "1987-11-04T14:08:18Z"
                format: date-time
            status:
                type: string
                description: Aggregation status
                example: running
                enum:
                    - running
                    - stopped
            tags:
                type: array
                items:
                    type: string
                    example: Ut voluptatum eum voluptates nihil veniam.
                description: List of tags
                example:
                    - foo
                    - bar
            title:
                type: string
                description: Title of the Feed
                example: Hashicorp Blog
            xmlUrl:
                type: string
                description: URL of the XML feed
                example: http://www.hashicorp.com/feed.xml
        description: A RSS feed
        example:
            cdate: "2013-11-19T18:43:33Z"
            errorCount: 2925184322516207636
            errorMsg: Quis exercitationem nostrum voluptatem et.
            htmlUrl: http://www.hashicorp.com/blog
            hubUrl: http://pubsubhubbub.appspot.com
            id: 5bfb841c028281c0051828c115fd1f50
            lastCheck: "2008-10-16T06:23:32Z"
            mdate: "1989-06-13T23:08:42Z"
            nbProcessedItems: 6516503059615108500
            nextCheck: "2011-04-21T18:20:47Z"
            status: stopped
            tags:
                - foo
                - bar
            title: Hashicorp Blog
            xmlUrl: http://www.hashicorp.com/feed.xml
        required:
            - id
            - xmlUrl
            - title
            - cdate
            - mdate
    FeedUpdateRequestBody:
        title: FeedUpdateRequestBody
        type: object
        properties:
            tags:
                type: string
                description: Comma separated list of tags
                example: foo,bar
            title:
                type: string
                description: Feed title
                example: A cool website
        example:
            tags: foo,bar
            title: A cool website
    FeedsPageResult:
        title: FeedsPageResult
        type: object
        properties:
            current:
                type: integer
                description: Current page number
                example: 1
                format: int64
            data:
                type: array
                items:
                    $ref: '#/definitions/FeedResult'
                description: List of feeds
                example:
                    - cdate: "1977-11-02T08:14:16Z"
                      errorCount: 3103945384136833810
                      errorMsg: Aspernatur odio eos.
                      htmlUrl: http://www.hashicorp.com/blog
                      hubUrl: http://pubsubhubbub.appspot.com
                      id: 5bfb841c028281c0051828c115fd1f50
